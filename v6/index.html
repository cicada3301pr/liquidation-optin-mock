style="background: #FFFFFF; border: 1px solid #E7E7EC; border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 10px"><div style="display: flex; gap: 12px; align-items: center"><span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 8px; background: #EEECFA; display: flex; align-items: center; justify-content: center; flex: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3C29B7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path><path d="M9 9l6 6M15 9l-6 6"></path></svg></span><h3 style="margin: 0; font-size: 17px; font-weight: 700">Reduced returns</h3></div><p style="margin: 0; font-size: 14px; line-height: 1.5; color: #3D3D4A">Clearance orders come back far less, so the discount is not eaten up by returns.</p><ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 1.45; color: #3D3D4A"><li style="display: flex; gap: 8px; align-items: flex-start"><span aria-hidden="true" style="color: #1E6B35; font-weight: 700">✓</span><span>Prepaid only: buyers pay online, so no RTO</span></li><li style="display: flex; gap: 8px; align-items: flex-start"><span aria-hidden="true" style="color: #1E6B35; font-weight: 700">✓</span><span>Refund Only: the buyer is refunded and nothing is shipped back to you</span></li><li style="display: flex; gap: 8px; align-items: flex-start"><span aria-hidden="true" style="color: #1E6B35; font-weight: 700">✓</span><span>No returned stock to handle or resell</span></li></ul><button type="button" onClick="{{ openRf }}" style="margin-top: 4px; min-height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid #3C29B7; background: #FFFFFF; color: #3C29B7; font-size: 13px; font-weight: 600; cursor: pointer">How Refund Only works</button></div></div></section>

const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g, WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;

  return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), scope); }

const BOOL = new Set(['checked','disabled','selected','readonly']);

  if (node.nodeType === 3) return [document.createTextNode(interp(node.nodeValue, scope))];
  if (node.nodeType !== 1) return [];
  const tag = node.tagName.toLowerCase();

  if (forAttr != null && !node.__inFor) { const list = look(scope, forAttr.match(WHOLE)[1]) || [];
    const as = tag === 'sc-for' ? node.getAttribute('as') : node.getAttribute('data-as'); const out = [];

      if (tag === 'sc-for') out.push(...kids(node, s)); else { node.__inFor = true; out.push(...render(node, s)); node.__inFor = false; } });
    return out; }
  const el = document.createElementNS(node.namespaceURI, node.localName);
  for (const a of Array.from(node.attributes)) { const n = a.name;
    if (n.startsWith('hint-') || n === 'data-for' || n === 'data-as') continue;
    const whole = a.value.match(WHOLE);

    if (whole) { const v = look(scope, whole[1]);

      if (n === 'value') { el.setAttribute('value', v == null ? '' : v); continue; }

        invBorder: invOk ? '#CFCFD8' : '#C0392B',
        invNote: invOk ? 'In stock ' + b.stock : (inv < 50 ? 'Minimum 50 units' : 'Only ' + b.stock + ' in stock'),
        invNoteColor: invOk ? '#6B6B7B' : '#B3261E',
        discBorder: discOk ? '#CFCFD8' : '#C0392B',
        discNote: discOk ? (disc === 50 ? 'Suggested' : ' ') : 'Minimum discount is 30%',
        discNoteColor: discOk ? '#6B6B7B' : '#B3261E',
        rfStr: rfOn ? 'true' : 'false',
        rfLocked: auto || !discOk,
        rfLabel: 'Refund Only for ' + b.pid,
        rfTrack: rfOn ? (auto ? '#9D93DE' : '#3C29B7') : '#CFCFD8',
        rfJustify: rfOn ? 'flex-end' : 'flex-start',
        rfCursor: (auto || !discOk) ? 'not-allowed' : 'pointer',
        rfNote: rfNote,
        toggleSel: () => this.upd(b.id, { sel: !s.sel }),
        setInv: (e) => this.upd(b.id, { inv: e.target.value }),
        setDisc: (e) => this.upd(b.id, { disc: e.target.value }),
        toggleRf: () => { if (!auto && discOk) this.upd(b.id, { rf: !s.rf }); }
      };
    });
    const nPages = Math.ceil(all.length / PER);
    const page = Math.min(this.state.page, nPages - 1);
    const pageRows = all.slice(page * PER, page * PER + PER);
    const pages = [];
    for (let i = 0; i < nPages; i++) {
      const cur = i === page;
      pages.push({ n: i + 1, current: cur ? 'page' : 'false', bg: cur ? '#3C29B7' : '#FFFFFF', color: cur ? '#FFFFFF' : '#1F1F29', border: cur ? '#3C29B7' : '#CFCFD8', go: () => this.setState({ page: i }) });
    }
    const allSel = this.base.every((b) => this.state.rows[b.id].sel);
    const enrolled = this.state.enr.map((e) => {
      const editing = this.state.editId === e.id;
      const pct = Math.round(100 * e.sold / e.declared);
      const soldOut = e.inv === 0;
      return {
        name: e.name, pid: e.pid, price: e.price, disc: e.disc, img: e.img, days: e.days,
        buyer: Math.round(e.price * (1 - e.disc / 100)),
        sold: e.sold, declared: e.declared, pct: pct, pctWidth: Math.min(pct, 100) + '%',
        ret: e.ret, retNote: e.ret > 10 ? 'Above your usual rate' : 'Within your usual rate',
        inv: e.inv, editing: editing, notEditing: !editing, draft: this.state.draft,
        invLabel: 'New inventory for ' + e.pid, editLabel: 'Edit inventory for ' + e.pid,
        status: soldOut ? 'Sold out' : 'Live',
        chipBg: soldOut ? '#EEEEF2' : '#E6F4EA', chipColor: soldOut ? '#4A4A57' : '#1E6B35',
        edit: () => this.setState({ editId: e.id, draft: String(e.inv) }),
        cancel: () => this.setState({ editId: null }),
        setDraft: (ev) => this.setState({ draft: ev.target.value }),
        save: () => {
          const v = Math.max(0, Math.round(Number(this.state.draft) || 0));
          const enr = this.state.enr.map((x) => x.id === e.id ? Object.assign({}, x, { inv: v }) : x);
          this.setState({ enr: enr, editId: null });
        }
      };
    });
    const isOpt = this.state.tab === 'opt';
    const stockValue = this.base.reduce((a, b) => a + b.stock * b.price, 0);
    const mkEx = (b) => {
      const buyer = Math.round(b.price * 0.5);
      const auto = cut > buyer;
      let from = 50;
      while (from < 90 && !(cut > Math.round(b.price * (1 - from / 100)))) from++;
      return {
        pid: b.pid, price: b.price, buyer: buyer,
        verdict: auto ? 'On automatically' : 'Your choice (auto from ' + from + '% off)',
        note: auto
          ? 'PID ' + b.pid + ': a return would cost ₹' + cut + ' to ship back, more than the ₹' + buyer + ' sale, so Refund Only switches on and stays locked.'
          : 'PID ' + b.pid + ': the ₹' + buyer + ' sale is worth more than the ₹' + cut + ' return trip, so you choose; at ' + from + '% off or deeper it switches on by itself.'
      };
    };
    return {
      heroValue: inr(stockValue),
      totalUnits: this.base.reduce((a, b) => a + b.stock, 0).toLocaleString('en-IN'),
      rfOpen: !!this.state.rfOpen,
      openRf: () => this.setState({ rfOpen: true }),
      closeRf: () => this.setState({ rfOpen: false }),
      rfCut: cut,
      exA: mkEx(this.base[0]),
      exB: mkEx(this.base[1]),
      pageRows: pageRows, pages: pages,
      rangeLabel: (page * PER + 1) + '-' + Math.min(all.length, page * PER + PER),
      prevDisabled: page === 0, nextDisabled: page >= nPages - 1,
      prevPage: () => this.setState({ page: Math.max(0, page - 1) }),
      nextPage: () => this.setState({ page: Math.min(nPages - 1, page + 1) }),
      fwd: fwd, rev: rev,
      eligibleCount: this.base.length, enrolledCount: this.state.enr.length,
      bulk: this.state.bulk,
      setBulk: (e) => this.setState({ bulk: e.target.value }),
      applyBulk: () => {
        const v = Number(this.state.bulk);
        if (!(v >= 30 && v <= 90)) return;
        const next = Object.assign({}, this.state.rows);
        this.base.forEach((b) => { if (next[b.id].sel) next[b.id] = Object.assign({}, next[b.id], { disc: v }); });
        this.setState({ rows: next });
      },
      allSel: allSel,
      toggleAll: () => {
        const next = Object.assign({}, this.state.rows);
        this.base.forEach((b) => { next[b.id] = Object.assign({}, next[b.id], { sel: !allSel }); });
        this.setState({ rows: next });
      },
      isOpt: isOpt, isEnr: !isOpt,
      optSelStr: isOpt ? 'true' : 'false', enrSelStr: isOpt ? 'false' : 'true',
      optLine: isOpt ? '#3C29B7' : 'transparent', enrLine: isOpt ? 'transparent' : '#3C29B7',
      optColor: isOpt ? '#3C29B7' : '#6B6B7B', enrColor: isOpt ? '#6B6B7B' : '#3C29B7',
      goOpt: () => this.setState({ tab: 'opt' }), goEnr: () => this.setState({ tab: 'enr' }),
      enrolled: enrolled,
      selUnits: selUnits.toLocaleString('en-IN'),
      enrolDisabled: selCount === 0 || anyBad,
      enrolBg: (selCount === 0 || anyBad) ? '#8A8A99' : '#3C29B7',
      enrolLabel: anyBad ? 'Fix highlighted rows' : (selCount === 0 ? 'Select products to enrol' : 'Enrol')
    };
  }
}

window.__mount(Component, {"forwardShipping": 60, "reverseShipping": 157});
</script>
